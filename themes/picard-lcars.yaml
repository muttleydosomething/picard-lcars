Picard_LCARS:
  # LCARS Colors
  lcars-orange: "#FF9900"
  lcars-pink: "#CC6699"
  lcars-purple: "#CC99CC"
  lcars-blue: "#9999CC"
  lcars-blue-grey: "#9999FF"
  lcars-red: "#CC6666"
  lcars-beige: "#FFCC99"
  lcars-brown: "#CC9966"
  lcars-black: "#000000"

  # Base interface colors
  primary-color: "var(--lcars-orange)"
  accent-color: "var(--lcars-pink)"
  dark-primary-color: "var(--lcars-purple)"
  light-primary-color: "var(--lcars-blue)"
  
  # Background and text
  primary-background-color: "var(--lcars-black)"
  secondary-background-color: "var(--lcars-black)"
  paper-card-background-color: "var(--lcars-black)"
  paper-listbox-background-color: "var(--lcars-black)"
  primary-text-color: "var(--lcars-beige)"
  secondary-text-color: "var(--lcars-blue-grey)"
  disabled-text-color: "var(--lcars-blue)"
  divider-color: "var(--lcars-purple)"
  
  # Cards
  ha-card-border-radius: "1em 0.3em 0.3em 0.3em"
  ha-card-box-shadow: "0"
  paper-card-header-color: "var(--lcars-orange)"
  
  # States
  state-icon-color: "var(--lcars-blue-grey)"
  state-icon-active-color: "var(--lcars-orange)"
  state-icon-unavailable-color: "var(--lcars-red)"
  
  # Sidebar
  sidebar-icon-color: "var(--lcars-blue-grey)"
  sidebar-text-color: "var(--lcars-beige)"
  sidebar-background-color: "var(--lcars-black)"
  sidebar-selected-icon-color: "var(--lcars-orange)"
  sidebar-selected-text-color: "var(--lcars-orange)"
  
  # Custom Resources
  # This adds your JS file to the theme
  theme-resources: >-
    /hacsfiles/picard-lcars/resources/picard-lcars-runtime.js